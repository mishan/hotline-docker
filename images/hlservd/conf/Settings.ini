# hlservd settings — the server's own defaults, with tracker registration
# off. hlservd writes a file like this itself when none exists; the keys it
# reads without writing (MaxConnectRate, BanBaseSecs, AccountFloodMultiplier,
# DownloadIdleTimeout, TrustLoopback) are left at their defaults.

[Server]
Name = My Hotline Server
Description = A Hotline Server
Port = 5500
MaxDownloads = 100
MaxDownloadsPerClient = 10
MaxConnectionsPerIP = 5
AdminLogin = admin

[Logging]
LogDownloads = true
LogUploads = true
LogConnects = true
LogAccountChanges = true

[Tracker]
Enabled = false
